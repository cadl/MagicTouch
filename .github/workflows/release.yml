name: Prepare DMG release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, matching MARKETING_VERSION (for example v1.0)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-magictouch-release
  cancel-in-progress: false

jobs:
  release:
    # Run trusted release tooling from the default branch, not from an input tag.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: macos-15
    timeout-minutes: 120
    environment: release
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      EXPECTED_APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
    steps:
      - name: Check out release tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate tag and draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/github_release.py prepare

      - name: Build and download notarized app from Xcode Cloud
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          XCODE_CLOUD_WORKFLOW_ID: ${{ vars.XCODE_CLOUD_WORKFLOW_ID }}
        run: python3 scripts/release/xcode_cloud.py

      - name: Verify app and create DMG
        run: python3 scripts/release/package_dmg.py

      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release/github_release.py upload

      - name: Remove downloaded artifacts and temporary packaging files
        if: always()
        run: rm -rf build/release
